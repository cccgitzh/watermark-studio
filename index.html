<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Watermark Studio · 本地批量图片水印工具</title>
    <meta
      name="description"
      content="纯浏览器本地运行的批量图片水印工具：多图层文字 / Logo 水印、九宫格定位、平铺与网格排版、透明度与字体调节、批量 ZIP 导出。图片不上传，零网络请求。"
    />
    <meta name="theme-color" content="#a8382b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <style>
      html {
        background: #f2efe7;
      }
      html[data-theme='dark'] {
        background: #121110;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
        color: #857e6f;
        font-size: 12px;
        letter-spacing: 0.08em;
      }
    </style>
  </head>
  <body>
    <div id="root"><div id="boot">WATERMARK STUDIO</div></div>
    <noscript>请启用 JavaScript 后使用本工具。</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
